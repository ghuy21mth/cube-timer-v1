<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef0f4;--sf:#fff;--tx:#161a22;--mu:#667085;--ln:#d9dde5;--ac:#1559e0;--ok:#12994a;--bad:#d92d2d;--wn:#e07b00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151b;--sf:#1a1e26;--tx:#eaedf3;--mu:#8e97a8;--ln:#2a303b;--ac:#6ea0ff;--ok:#4ade80;--bad:#ff6b6b;--wn:#ffb02e}}
:root[data-theme=dark]{--bg:#12151b;--sf:#1a1e26;--tx:#eaedf3;--mu:#8e97a8;--ln:#2a303b;--ac:#6ea0ff;--ok:#4ade80;--bad:#ff6b6b;--wn:#ffb02e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}

label{display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
#app{display:grid;height:100%;grid-template:"h h" auto "a m" 1fr/280px 1fr}

.r{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;cursor:pointer}
.r:hover{background:var(--sf)}.r.on{background:var(--sf);outline:1px solid var(--ac)}.r span{color:var(--mu)}
#sc{display:flex;gap:12px;align-items:center}

#app.fx #tz{position:fixed;inset:0;z-index:5;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);cursor:default}

#tm.sv{font:400 clamp(84px,19vw,210px)/1 "Times New Roman",Times,serif;letter-spacing:0}
[hidden]{display:none!important}
#md{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55)}
.bx{max-width:360px;padding:22px;text-align:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
.bx p{margin:0 0 16px;font-size:16px}

@media(max-width:820px){#app{height:auto;min-height:100%;grid-template:"h" auto "m" 1fr "a" auto/1fr}aside{border-right:0;border-top:1px solid var(--ln)}#ls{max-height:260px}main{padding:12px}}

#bgl{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgm,#bgm img,#bgm video,#bgc{position:absolute;inset:0;width:100%;height:100%}

#app{position:relative;z-index:1}

#gi{display:inline-flex}#gi img{width:26px;height:26px;border-radius:50%}

#cr{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none;user-select:none;font:600 11px/1 system-ui,sans-serif;letter-spacing:.02em;color:#fff;background:rgba(10,12,22,.58);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 10px;text-shadow:0 1px 2px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

#bgp{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));right:16px;z-index:8;width:min(360px,calc(100vw - 32px));max-height:calc(100% - 90px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#bgp .ph{display:flex;justify-content:space-between;align-items:center}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tb{display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:8px;background:var(--bg)}
.tb canvas{width:100%;aspect-ratio:16/9;display:block;background:var(--bg)}
.tb span{font-size:11px;padding:4px 2px;text-align:center}
.tb.on{outline:2px solid var(--ac);outline-offset:1px}
#app.fx #bgp{opacity:0;pointer-events:none}
</style>

<script>
const $=s=>document.querySelector(s),cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ACC='cubetimer.acc';let S=null,accUid=0,accU=null;try{localStorage.removeItem('cubetimer.v1');localStorage.removeItem('cubetimer.bgu');const c=JSON.parse(localStorage.getItem(ACC));if(c&&c.uid&&c.d&&Array.isArray(c.d.ss)&&c.d.ss.length){S=c.d;accUid=c.uid;accU=c.u||null}}catch(e){}
/* Khách: mọi thứ chỉ nằm trong bộ nhớ, F5 là mất hết. Đăng nhập Google: tất cả (lượt giải, cài đặt, nền) lưu trên tài khoản. */
S={ss:S&&S.ss||[{n:'Phiên 1',v:[]}],cur:S&&S.cur>=0&&S.cur<S.ss.length?S.cur:0,ts:S&&S.ts||0,insp:S&&S.insp?1:0,hide:S&&S.hide?1:0,th:S&&S.th||undefined,bg:S&&S.bg||'',bo:S&&S.bo>0?S.bo:1,bgu:S&&S.bgu||null};
const accSave=()=>{if(!accUid)return;try{localStorage.setItem(ACC,JSON.stringify({uid:accUid,u:usr?{displayName:usr.displayName,email:usr.email,photoURL:usr.photoURL}:accU,d:payload()}))}catch(e){}};
const sv=()=>{S.ts=Date.now();accSave();cloudSave()};
const cs=()=>S.ss[S.cur],val=s=>s.p<0?Infinity:s.t+(s.p?2000:0);
const fmt=v=>{if(v==null)return'–';if(v===Infinity)return'DNF';v=Math.floor(v/10);const c=v%100;let s=(v-c)/100;const m=s/60|0;s%=60;return(m?m+':'+(s<10?'0':''):'')+s+'.'+(c<10?'0':'')+c};
const ao=(a,n,e=a.length)=>{if(e<n)return null;const w=a.slice(e-n,e).sort((x,y)=>x-y),k=Math.ceil(n/20),r=w.slice(k,n-k);return r.reduce((x,y)=>x+y,0)/r.length};
/* scramble + mô phỏng khối để vẽ lưới */
const F='URFDLB',AX={U:1,D:1,R:0,L:0,F:2,B:2},LY={U:1,R:1,F:1,D:-1,L:-1,B:-1},C=[['#e03232','#ff8a00'],['#fff','#ffd500'],['#0a9d4f','#1559e0']];
function gen(){const s=[];let a=-1,b=-1;while(s.length<20){const f=Math.random()*6|0;if(f%3==a%3&&(f==a||b%3==a%3))continue;s.push(F[f]+['',"'",'2'][Math.random()*3|0]);b=a;a=f}return s.join(' ')}
function cube(){const k=[];for(let x=-1;x<2;x++)for(let y=-1;y<2;y++)for(let z=-1;z<2;z++){const p=[x,y,z];for(let a=0;a<3;a++)if(p[a]){const n=[0,0,0];n[a]=p[a];k.push({p:[x,y,z],n,c:C[a][p[a]>0?0:1]})}}return k}
function mv(k,m){const f=m[0],q=m[1]=='2'?2:m[1]=="'"?3:1,a=AX[f],l=LY[f],b=(a+1)%3,c=(a+2)%3;for(let i=0;i<q;i++)for(const s of k)if(s.p[a]==l)for(const v of[s.p,s.n]){const u=v[b],w=v[c];if(l<0){v[b]=-w;v[c]=u}else{v[b]=w;v[c]=-u}}}
function draw(sc){const k=cube();sc.split(' ').forEach(m=>mv(k,m));const g=$('#net').getContext('2d'),u=40;g.clearRect(0,0,480,360);for(const s of k){const[x,y,z]=s.p,[i,j,l]=s.n,[ox,oy,c,r]=j>0?[3,0,x+1,z+1]:l>0?[3,3,x+1,1-y]:i>0?[6,3,1-z,1-y]:l<0?[9,3,1-x,1-y]:i<0?[0,3,z+1,1-y]:[3,6,x+1,1-z],X=(ox+c)*u,Y=(oy+r)*u;g.fillStyle='#1d2027';g.fillRect(X,Y,u,u);g.fillStyle=s.c;g.fillRect(X+3,Y+3,u-6,u-6)}}
/* thống kê, lịch sử, biểu đồ */
let st='idle',t0=0,i0=0,ins=0,ht=0,raf=0,pen=0,scr='',sel=-1,rz=0,ar=0;
const tm=$('#tm'),A=$('#app'),T=e=>e&&e.timeStamp>0&&e.timeStamp<1e11?e.timeStamp:performance.now();
const ci=()=>{const n=cs().v.length;return sel>=0&&sel<n?sel:n-1};
const lab=s=>fmt(val(s))+(s.p==2?'+':'');
function stats(){const V=cs().v.map(val),n=V.length;let h='<tr><th></th><th>Hiện tại</th><th>Tốt nhất</th><th>Tệ nhất</th></tr>';
for(const k of[1,5,12,100]){let c=null,b=null,w=null,dn=0;if(n>=k){c=k<2?V[n-1]:ao(V,k);for(let i=k;i<=n;i++){const x=k<2?V[i-1]:ao(V,k,i);if(b==null||x<b)b=x;if(isFinite(x)){if(w==null||x>w)w=x}else dn=1}if(w==null&&dn)w=Infinity}
h+=`<tr><td>${k<2?'Đơn':'Ao'+k}</td><td class="m">${fmt(c)}</td><td class="m b">${fmt(b)}</td><td class="m w">${fmt(w)}</td></tr>`}
const f=V.filter(isFinite);h+=`<tr><td>Trung bình</td><td class="m" colspan="3">${f.length?fmt(f.reduce((a,b)=>a+b,0)/f.length):'–'} (${n} lần giải)</td></tr>`;$('#tb').innerHTML=h}
function list(){const v=cs().v,c=ci(),o=[];for(let i=v.length-1;i>=0&&o.length<150;i--)o.push(`<div class="r${i==c?' on':''}" data-i="${i}"><span>${i+1}</span><b class="m">${lab(v[i])}</b></div>`);$('#ls').innerHTML=o.join('')||'<p class="mu">Chưa có lần giải nào.</p>'}
function info(){const s=cs().v[ci()];$('#inf').textContent=s?`Lần #${ci()+1} (${new Date(s.d).toLocaleString('vi-VN')}): ${s.sc}`:'Chưa có lần giải nào.'}
function chart(){const c=$('#ch'),r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight,V=cs().v.map(val),n=V.length,a=Math.max(0,n-60),f=V.slice(a).filter(isFinite);if(!w||!h)return;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);
if(f.length<2){x.fillStyle=cv('--mu');x.font='12px system-ui';x.fillText('Biểu đồ xuất hiện sau 2 lần giải',8,h/2);return}
const mx=Math.max(...f),mn=Math.min(...f),X=i=>10+(w-20)*(i-a)/Math.max(1,n-1-a),Y=t=>h-10-(h-20)*(t-mn)/(mx-mn||1);
x.fillStyle=cv('--mu');for(let i=a;i<n;i++)if(isFinite(V[i])){x.beginPath();x.arc(X(i),Y(V[i]),2.5,0,7);x.fill()}
for(const[k,col]of[[5,'--ac'],[12,'--wn']]){x.beginPath();let on=0;for(let i=a;i<n;i++){const y=ao(V,k,i+1);if(y==null||!isFinite(y)){on=0;continue}x[on?'lineTo':'moveTo'](X(i),Y(y));on=1}x.strokeStyle=cv(col);x.lineWidth=2;x.stroke()}}
function refresh(){stats();list();info();chart();const v=cs().v,l=v[v.length-1];if(st=='idle'&&!ins)tm.textContent=l?lab(l):'0.00';$('#se').innerHTML=S.ss.map((s,i)=>s.k!=cs().k?'':`<option value="${i}"${i==S.cur?' selected':''}>${s.n} (${s.v.length})</option>`).join('');$('#pz').value=cs().k;sv()}
const rnd=n=>Math.random()*n|0,pk=(s,l,m)=>{const o=[];let p;while(o.length<l){const f=s[rnd(s.length)];if(f!=p){p=f;o.push(f+m[rnd(m.length)])}}return o};
function big(n,len){const h=n>>1,o=[];let ax=-1,us=0;while(o.length<len){const x=rnd(3),f=rnd(2),d=1+rnd(h),w=d>1&&(n<6||rnd(2)>0);let m=0;if(w)for(let i=0;i<d;i++)m|=1<<(f?n-1-i:i);else m=1<<(f?n-d:d-1);if(x==ax){if(m&us)continue;us|=m}else{ax=x;us=m}o.push((d>1&&(!w||d>2)?d:'')+(f?'DLB':'URF')[x]+(w?'w':'')+['',"'",'2'][rnd(3)])}return o.join(' ')}
const pyra=()=>pk('ULRB',10,['',"'"]).concat([...'ulrb'].map(t=>[,t,t+"'"][rnd(3)]).filter(Boolean)).join(' ');
